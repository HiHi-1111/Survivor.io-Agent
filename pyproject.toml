[project]
name = "survivor-io-agent"
version = "0.1.0"
description = "Research and automation agent for Survivor.io"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "composio>=0.8.0",
  "composio-openai-agents>=0.1.0",
  "openai-agents>=0.2.0",
  "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP035", "UP037"]

[tool.ruff.lint.per-file-ignores]
"survivor_optimizer/catalog.py" = ["I001"]
"tests/test_transitions.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
